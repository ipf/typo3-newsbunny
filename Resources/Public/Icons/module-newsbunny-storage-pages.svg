<?xml version="1.0" encoding="utf-8" standalone="yes"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!--
        Icon of the storage page view of EXT:news_bunny. Same TYPO3 v14 icon language as
        module-newsbunny.svg: transparent background, currentColor silhouette, one accent
        from the Core "icon-color-accent" CSS token. Both views of the module therefore
        read as one family in the backend and both follow the Camino theme in light and
        in dark mode.

        The folder with the two record lines keeps the metaphor of the previous icon:
        a storage folder that holds a list of news records.
    -->
    <g fill="currentColor">
        <path d="M8 17a4 4 0 0 1 4-4h11.5a4 4 0 0 1 2.8 1.2L31 19h21a4 4 0 0 1 4 4v1H8v-7Z"/>
        <path d="M8 24h48v25a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4V24Z"/>
    </g>
    <!-- The listed records are the single accent, the second line shorter to read as a list. -->
    <g fill="var(--icon-color-accent, #ff8700)">
        <path d="M19.5 30h25a3 3 0 0 1 0 6h-25a3 3 0 0 1 0-6Z"/>
        <path d="M19.5 41h16a3 3 0 0 1 0 6h-16a3 3 0 0 1 0-6Z"/>
    </g>
</svg>
