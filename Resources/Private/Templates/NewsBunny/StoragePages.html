<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module"/>

<f:section name="Content">
    <h1><f:translate key="storagePages.title"/></h1>
    <p class="text-body-secondary mb-4"><f:translate key="storagePages.subtitle"/></p>

    <p>
        <f:if condition="{context.pageId}">
            <span class="badge badge-info">
                <f:translate key="pageTree.selected" arguments="{0: context.pageId}"/>
            </span>
        </f:if>
    </p>

    <f:if condition="{rows}">
        <f:then>
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th><f:translate key="storagePages.column.page"/></th>
                            <th class="text-end"><f:translate key="storagePages.column.news"/></th>
                            <th class="text-end"><f:translate key="storagePages.column.categories"/></th>
                            <th class="text-end"><f:translate key="storagePages.column.tags"/></th>
                            <th class="col-control text-end">
                                <f:translate key="storagePages.column.actions"/>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{rows}" as="row">
                            <tr>
                                <td>
                                    <a href="{row.listUrl}">{row.page.path}</a>
                                    <f:if condition="{row.page.hidden}">
                                        <span class="badge badge-warning">
                                            <f:translate key="storagePages.hidden"/>
                                        </span>
                                    </f:if>
                                </td>
                                <td class="text-end">{row.newsCount}</td>
                                <td class="text-end">{row.categoryCount}</td>
                                <td class="text-end">{row.tagCount}</td>
                                <td class="col-control text-end text-nowrap">
                                    <f:if condition="{row.pageEditUrl}">
                                        <a href="{row.pageEditUrl}" class="btn btn-default btn-sm">
                                            <f:translate key="list.actions.edit"/>
                                        </a>
                                    </f:if>
                                    <f:if condition="{row.createUrls.news}">
                                        <a href="{row.createUrls.news}" class="btn btn-primary btn-sm">
                                            + <f:translate key="recordType.news"/>
                                        </a>
                                    </f:if>
                                    <f:if condition="{row.createUrls.category}">
                                        <a href="{row.createUrls.category}" class="btn btn-primary btn-sm">
                                            + <f:translate key="recordType.category"/>
                                        </a>
                                    </f:if>
                                    <f:if condition="{row.createUrls.tag}">
                                        <a href="{row.createUrls.tag}" class="btn btn-primary btn-sm">
                                            + <f:translate key="recordType.tag"/>
                                        </a>
                                    </f:if>
                                </td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
        </f:then>
        <f:else>
            <f:be.infobox state="{f:constant(name: 'TYPO3\\CMS\\Core\\Type\\ContextualFeedbackSeverity::INFO')}"
                          title="{f:translate(key: 'storagePages.title')}">
                <p><f:translate key="storagePages.empty"/></p>
            </f:be.infobox>
        </f:else>
    </f:if>

    <p class="mt-3">
        <a href="{listUrl}" class="btn btn-default">
            <core:icon identifier="actions-arrow-left-alt"/>
            <f:translate key="list.title"/>
        </a>
    </p>
</f:section>

</html>
