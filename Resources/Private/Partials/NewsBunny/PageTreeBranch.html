<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<!--
    The rows of the tree all start with a box of the width of a small icon, which
    holds the marker of a branch and stays empty on a page without children. The
    marker the browser draws for a branch is switched off on the summary, because it
    is drawn at the left edge of the row and takes the space of a box that only the
    branches of a level would have, which left the titles of a level unaligned and
    the marker of the top level against the frame of the panel.

    The title of a page is truncated on its own, the numbers next to it are never
    shortened away by a long page title. Every level of the tree is a list of its
    own which carries the indent of the level.
-->
<f:for each="{branches}" as="branch">
    <li>
        <f:if condition="{branch.children}">
            <f:then>
                <details class="newsbunny-page-tree-branch"{f:if(condition: branch.expanded, then: ' open')}>
                    <summary style="list-style: none" class="{f:if(condition: branch.current, then: 'active')}" title="{branch.path}">
                        <a href="{branch.url}" class="d-flex align-items-center px-2 py-1 text-decoration-none">
                            <svg class="flex-shrink-0" style="width: 16px" width="16" height="16" viewBox="0 0 16 16"
                                 fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                 stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <path d="M6 3.5 10.5 8 6 12.5"/>
                            </svg>
                            <span class="text-truncate">
                                <core:icon identifier="apps-pagetree-page-default"/>
                                {branch.title}
                            </span>
                            <f:render partial="NewsBunny/PageTreeCounts" arguments="{branch: branch}"/>
                            <f:if condition="{branch.hidden}">
                                <span class="badge badge-warning flex-shrink-0"><f:translate key="storagePages.hidden"/></span>
                            </f:if>
                        </a>
                    </summary>
                    <ul class="list-unstyled m-0" style="padding-left: {branch.childIndent}px">
                        <f:render partial="NewsBunny/PageTreeBranch" arguments="{branches: branch.children}"/>
                    </ul>
                </details>
            </f:then>
            <f:else>
                <a href="{branch.url}"
                   class="d-flex align-items-center px-2 py-1{f:if(condition: branch.current, then: ' active')}"
                   title="{branch.path}">
                    <span class="flex-shrink-0" style="width: 16px" aria-hidden="true"></span>
                    <span class="text-truncate">
                        <core:icon identifier="apps-pagetree-page-default"/>
                        {branch.title}
                    </span>
                    <f:render partial="NewsBunny/PageTreeCounts" arguments="{branch: branch}"/>
                    <f:if condition="{branch.hidden}">
                        <span class="badge badge-warning flex-shrink-0"><f:translate key="storagePages.hidden"/></span>
                    </f:if>
                </a>
            </f:else>
        </f:if>
    </li>
</f:for>
