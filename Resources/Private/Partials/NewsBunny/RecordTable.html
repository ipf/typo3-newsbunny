<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:if condition="{records}">
    <f:then>
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <f:for each="{columns}" as="column">
                            <th class="col-{column}">
                                <f:if condition="{sortingLinks.{column}}">
                                    <a href="{sortingLinks.{column}}" class="fw-bold">
                                        <f:translate key="list.column.{column}"/>
                                        <core:icon identifier="{sortingIcons.{column}}"/>
                                    </a>
                                </f:if>
                                <f:if condition="{sortingLinks.{column}}">
                                    <f:else>
                                        <f:translate key="list.column.{column}"/>
                                    </f:else>
                                </f:if>
                            </th>
                        </f:for>
                        <th class="col-control"></th>
                    </tr>
                </thead>
                <tbody>
                    <f:for each="{records}" as="record">
                        <tr class="{f:if(condition: record.isHidden, then: 'opacity-50')}">
                            <f:for each="{columns}" as="column">
                                <td class="col-{column}">
                                    <f:render partial="NewsBunny/RecordCell" arguments="{column: column, record: record}"/>
                                </td>
                            </f:for>
                            <td class="col-control text-nowrap text-end">
                                <f:render partial="NewsBunny/RecordActions" arguments="{_all}"/>
                            </td>
                        </tr>
                    </f:for>
                </tbody>
            </table>
        </div>
    </f:then>
    <f:else>
        <f:be.infobox state="{f:constant(name: 'TYPO3\\CMS\\Core\\Type\\ContextualFeedbackSeverity::INFO')}"
                      title="{f:translate(key: 'list.empty')}">
            <p><f:translate key="list.emptyHint"/></p>
        </f:be.infobox>
    </f:else>
</f:if>
