<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:if condition="{pageCount} > 1">
    <nav class="mt-3">
        <ul class="pagination">
            <li class="page-item{f:if(condition: pagination.hasPrevious, then: ' disabled')}">
                <a class="page-link" href="{pagination.first}" title="{f:translate(key: 'pagination.first')}">
                    <core:icon identifier="actions-arrow-start-end"/>
                </a>
            </li>
            <li class="page-item{f:if(condition: pagination.hasPrevious, then: ' disabled')}">
                <a class="page-link" href="{pagination.previous}" title="{f:translate(key: 'pagination.previous')}">
                    <core:icon identifier="actions-arrow-left-alt"/>
                </a>
            </li>
            <f:for each="{pagination.numbers}" as="number">
                <li class="page-item{f:if(condition: number.current, then: ' active')}">
                    <a class="page-link" href="{number.url}">{number.label}</a>
                </li>
            </f:for>
            <li class="page-item{f:if(condition: pagination.hasNext, then: ' disabled')}">
                <a class="page-link" href="{pagination.next}" title="{f:translate(key: 'pagination.next')}">
                    <core:icon identifier="actions-arrow-right-alt"/>
                </a>
            </li>
            <li class="page-item{f:if(condition: pagination.hasNext, then: ' disabled')}">
                <a class="page-link" href="{pagination.last}" title="{f:translate(key: 'pagination.last')}">
                    <core:icon identifier="actions-arrow-end-end"/>
                </a>
            </li>
        </ul>
    </nav>
</f:if>
